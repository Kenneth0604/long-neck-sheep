<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>伸脖羊長脖子（測試版）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;touch-action:none}
  #score{position:fixed;top:54px;left:12px;line-height:1;color:#fff;font-size:34px;font-weight:900;pointer-events:none;padding:0 4px;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.45)}
  #neck:empty{display:none}
  #neck{position:fixed;top:92px;left:12px;text-align:left;padding:0 4px;color:#fff;font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 6px rgba(0,0,0,.5)}
  #panel{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,1.5,.4,1);
    background:#fffaf0;border-radius:24px;padding:22px 28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);color:#3b2a1a;min-width:210px;max-width:92vw;box-sizing:border-box;padding-left:18px;padding-right:18px}
  #panel.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  #lbForm{display:none;gap:6px;margin:10px 0 2px} #lbForm.on{display:flex}
  #nameIn{flex:1;min-width:0;padding:8px 10px;border-radius:12px;border:2px solid #2b2b2b;font-size:15px;font-weight:700}
  .pbtn{padding:8px 12px;border-radius:12px;border:2.5px solid #2b2b2b;background:#ffb067;font-weight:900;font-size:14px;box-shadow:0 3px 0 #2b2b2b;cursor:pointer}
  .pbtn.alt{background:#fff} .btnrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
  #lbMsg{font-size:13px;color:#d6336c;font-weight:800;min-height:1em;margin-top:4px}
  #boardBtn{pointer-events:auto;margin:4px 0 14px}
  #board{position:fixed;inset:0;z-index:20;background:rgba(20,26,46,.55);display:none;align-items:center;justify-content:center}
  #board.on{display:flex}
  #board .card{background:#fffaf0;border-radius:22px;padding:18px 20px;width:min(86vw,340px);max-height:80vh;overflow:auto;color:#3b2a1a;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  #board h2{margin:0 0 10px;text-align:center;font-size:22px}
  #boardList{list-style:none;margin:0;padding:0}
  #boardList li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed #e3d6c3;font-weight:800}
  #boardList li .rk{width:30px;text-align:center;font-size:16px} #boardList li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #boardList li .sc{color:#ff7a1a;font-size:18px} #boardList li.me{background:#fff0c2;border-radius:10px}
  #boardNote{text-align:center;color:#8a7a6a;font-size:13px;margin:10px 0}
  #panel h1{margin:0 0 6px;font-size:min(6.2vw,28px);white-space:nowrap} #pn{white-space:nowrap;font-size:min(3.8vw,15px)} #pcmp{white-space:normal;margin-top:6px;font-weight:900;color:#ff7a1a;font-size:min(4vw,16px)} #pfact{white-space:pre-line;margin-top:4px;font-size:min(3.4vw,13px);opacity:.8;line-height:1.45} #panel .row{display:flex;justify-content:space-around;margin:12px 0;font-weight:800}
  #panel .row b{display:block;font-size:30px;color:#ff7a1a} #panel p{margin:8px 0 0;color:#8a7a6a;font-size:14px}
  #ready{position:fixed;left:0;right:0;top:16%;text-align:center;color:#fff;font-weight:900;font-size:19px;pointer-events:none;line-height:1.6;
    text-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity .3s, transform .3s}
  #ready.off{opacity:0;transform:translateY(-20px)}
  #ready .logo{font-size:min(19vw,92px);letter-spacing:.04em;line-height:1.1;margin-bottom:2px}
  #ready .logo span{display:inline-block;color:#fffdf7;-webkit-text-stroke:3px #2b2b2b;paint-order:stroke fill;text-shadow:0 6px 0 #ff7a1a, 0 10px 18px rgba(120,40,0,.25);
    animation:bob 1.6s ease-in-out infinite}
  #ready .logo span:nth-child(2){animation-delay:.15s} #ready .logo span:nth-child(3){animation-delay:.3s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  #ready .sub{font-size:16px;letter-spacing:.3em;margin-bottom:18px;color:#fff3e6}
  #fanNote{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:rgba(255,255,255,.85);font-size:11px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  #badge{position:fixed;top:12px;left:12px;background:#fffdf7;color:#2b2b2b;font-weight:900;font-size:15px;padding:6px 12px;border-radius:16px;
    border:2.5px solid #2b2b2b;box-shadow:0 3px 0 #ff7a1a;pointer-events:none}
  .stats{font-size:15px;margin:-8px 0 14px;color:#fff;letter-spacing:.05em}
  .stats2{font-size:13px;color:#8a7a6a;margin-top:6px;white-space:nowrap}
  #drops{position:fixed;top:114px;left:12px;color:#fff;font-size:15px;font-weight:900;pointer-events:none;padding:0 4px;
    text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 6px rgba(0,0,0,.5)}
  #drops:empty{display:none}
  #drops.pop{animation:dpop .35s ease-out}
  @keyframes dpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
  #partyGlow{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .4s;
    box-shadow:inset 0 0 60px 18px rgba(255,122,26,.85), inset 0 0 140px 40px rgba(255,190,120,.45)}
  #partyGlow.on{opacity:1;animation:glow .5s ease-in-out infinite alternate}
  @keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35)}}
  #partyBanner{position:fixed;left:0;right:0;top:20%;text-align:center;z-index:26;pointer-events:none;color:#fff;font-weight:900;
    font-size:min(11vw,56px);-webkit-text-stroke:3px #ff7a1a;paint-order:stroke fill;text-shadow:0 5px 0 #c4500a;opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
  #partyBanner.on{opacity:1;transform:scale(1)}
  #human{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,14,8,.45)}
  #human.on{display:flex}
  #human .card{position:relative;background:#fffdf7;border-radius:14px;padding:18px 20px 14px;width:min(86vw,320px);box-shadow:0 10px 30px rgba(0,0,0,.3);color:#3a2a1a;font-weight:800;text-align:center}
  #human .t{font-size:17px;margin-bottom:4px} #human .s{font-size:13px;color:#8a7a6a;font-weight:700;margin-bottom:12px}
  #human .box{display:flex;align-items:center;gap:12px;border:1px solid #d8d0c4;border-radius:6px;background:#f9f9f9;padding:12px 14px;text-align:left;font-size:16px;cursor:pointer;user-select:none;position:relative}
  #human .cb{flex:none;width:26px;height:26px;border:2px solid #9a948c;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#1a9a4a}
  #human .box.ok .cb{border-color:#1a9a4a} #human .tm{font-size:12px;color:#b05a20;margin-top:10px;font-weight:700}
  #topBtns{position:fixed;top:12px;right:12px;z-index:40;display:flex;gap:8px;align-items:center}
  body.hitmode #topBtns{top:42px}
  #pauseBtn{background:#fffdf7;color:#2b2b2b;font-weight:900;font-size:15px;width:38px;height:34px;padding:0;border-radius:16px;border:2.5px solid #2b2b2b;box-shadow:0 3px 0 #2b2b2b;cursor:pointer}
  #pauseBtn.hide{display:none}
  #pauseBtn{display:flex;align-items:center;justify-content:center}
  .ic-pause{display:inline-block;width:12px;height:14px;position:relative;vertical-align:-2px}                 /* hand-drawn icons, no emoji */
  .ic-pause::before,.ic-pause::after{content:'';position:absolute;top:0;width:4px;height:100%;background:currentColor;border-radius:1.5px}
  .ic-pause::before{left:1px} .ic-pause::after{right:1px}
  .ic-play{display:inline-block;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor;margin-right:6px;vertical-align:-2px}
  #pause .t .ic-pause{width:15px;height:18px;margin-right:8px;vertical-align:-2px} #pause .t .ic-pause::before,#pause .t .ic-pause::after{width:5px}
  body.hitmode #pauseBtn{background:#1f2329;color:#e8eaed;border:1px solid #5f6368;box-shadow:none;border-radius:4px;height:28px}
  #pause{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(20,14,8,.45)}
  #pause.on{display:flex}
  #pause .card{background:#fffdf7;border-radius:16px;padding:20px 26px 16px;text-align:center;color:#3a2a1a;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:200px}
  #pause .t{font-size:22px;margin-bottom:12px} #pause .n{font-size:13px;color:#8a7a6a;font-weight:700;margin-top:10px}
  #pause .cd{font-size:44px;color:#ff7a1a;line-height:1.1}
  body.hitmode #pause{background:rgba(0,0,0,.6)} body.hitmode #pause .card{background:#1f2329;color:#e8eaed;border:1px solid #5f6368;border-radius:6px;font-family:"Roboto Mono",ui-monospace,Menlo,monospace}
  #styleBtn{position:static;background:#fffdf7;color:#2b2b2b;font-weight:900;font-size:14px;padding:6px 12px;border-radius:16px;border:2.5px solid #2b2b2b;box-shadow:0 3px 0 #2b2b2b;cursor:pointer;transition:opacity .2s}
  body.hitmode #partyGlow, body.hitmode #partyBanner, body.hitmode #badge, body.hitmode #score, body.hitmode #neck, body.hitmode #drops{display:none!important}
  body.hitmode #styleBtn{background:#1f2329;color:#e8eaed;border:1px solid #5f6368;box-shadow:none;border-radius:4px;font:600 12px "Roboto Mono",ui-monospace,Menlo,monospace}
  body.hitmode #betaTag{top:76px}
  body.hitmode #ready .logo, body.hitmode #ready .sub{opacity:.25}
  #styleBtn.hide{opacity:0;pointer-events:none}
  #betaTag{position:fixed;top:52px;right:14px;z-index:25;font-size:11px;font-weight:900;color:#fff;background:#d6336c;padding:2px 8px;border-radius:10px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">0</div>
<div id="neck"></div><div id="drops"></div>
<div id="partyGlow"></div><div id="partyBanner">🌊 洋流衝刺！</div>
<div id="topBtns"><button id="pauseBtn" class="hide" aria-label="暫停"><span class="ic-pause"></span></button><button id="styleBtn">🎨 原版</button></div>
<div id="pause"><div class="card"><div class="t" id="pauseT"><span class="ic-pause"></span>暫停中</div><button class="pbtn" id="resumeBtn"><span class="ic-play"></span>繼續</button><div class="n" id="pauseN">也可以按 P 或 Esc</div></div></div><div id="betaTag">測試版</div>
<div id="badge">🐑 伸脖羊</div><div id="fanNote">非官方粉絲創作・與任何競選團隊無關・<span id="ver"></span></div>
<div id="ready"><div class="logo"><span>伸</span><span>脖</span><span>羊</span></div><div class="sub">長 脖 子</div>
<div class="stats" id="statsReady"></div><button class="pbtn" id="boardBtn" style="display:none">🏆 全域排行榜</button><br>👆 點一下，羊頭就往上跳<br><span style="font-size:15px">身體留在原地，脖子一路伸長穿過臺北地標</span></div>
<div id="panel"><h1>🐑 伸脖羊：「晚安！」</h1><div class="row"><div>分數<b id="ps">0</b></div><div>最佳<b id="pb">0</b></div></div><div id="pn"></div><div id="pcmp"></div><div id="pfact"></div><div class="stats2" id="statsPanel"></div>
<div id="lbForm"><input id="nameIn" maxlength="12" placeholder="輸入名字上排行榜" autocomplete="nickname"><button class="pbtn" id="sendBtn">上傳</button></div>
<div id="lbMsg"></div>
<div class="btnrow"><button class="pbtn alt" id="boardBtn2" style="display:none">🏆 排行榜</button><button class="pbtn" id="againBtn">再玩一次</button></div></div>
<div id="human"><div class="card"><div class="t">🐑 休息一下！</div><div class="s">伸脖羊要確認你是真人</div><div class="box" id="humanBox"><div class="cb" id="humanCb"></div><div>我不是機器人</div></div><div class="tm" id="humanTm"></div></div></div>
<div id="board"><div class="card"><h2>🏆 全域排行榜</h2><ol id="boardList"></ol><div id="boardNote">讀取中…</div>
<div class="btnrow"><button class="pbtn" id="boardClose">關閉</button></div></div></div>
<script>
const cv = document.getElementById('c'); let cx = cv.getContext('2d'); const MAIN_CX = cx;
// ribbons get their own layer on top of everything (score panel included)
const rcv = document.createElement('canvas'); rcv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:30'; document.body.appendChild(rcv);
const rctx = rcv.getContext('2d');
let W, H, DPR;
function resize(){ DPR = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px'; cx.setTransform(DPR,0,0,DPR,0,0);
  if (typeof rcv !== 'undefined'){ rcv.width = W*DPR; rcv.height = H*DPR; rcv.style.width = W+'px'; rcv.style.height = H+'px'; } }
addEventListener('resize', resize); resize();
const PX_PER_M = 60;
const S = () => Math.min(1.1, Math.max(0.75, H/760));
const groundY = () => H*0.86;
const GAME_VERSION = 'v1.15.5-beta';   // bump on every release: major.minor.patch
document.getElementById('ver').textContent = GAME_VERSION;
const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x-Math.floor(x); };
let camX = 0, t = 0;

// ---------- body, fixed at the starting point ----------
const BODY_X = () => 80*S();                                  // world x of the body
const neckBase = () => ({ x: BODY_X() + 55*S(), y: groundY() - 120*S() });
function puff(x,y,r,fill='#fffdf7'){ cx.fillStyle=fill; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill(); }
function drawBody(){
  const s = S(), bx = BODY_X() - camX, gy = groundY(); if (bx < -200) return;
  cx.fillStyle='#2b2b2b'; for (const lx of [-60,-30,20,50]) cx.fillRect(bx+lx*s-6, gy-75*s, 12*s, 75*s);
  cx.fillStyle='rgba(0,0,0,.15)'; cx.beginPath(); cx.ellipse(bx, gy+3, 95*s, 9*s, 0, 0, 7); cx.fill();
  const by = gy - 100*s;
  for (const [ox,oy,r] of [[0,0,50],[-48,6,42],[44,2,40],[-20,-28,38],[22,-26,38],[0,20,38]]) puff(bx+ox*s, by+oy*s, r*s, '#eeeae0');
  for (const [ox,oy,r] of [[0,0,44],[-48,6,36],[44,2,34],[-20,-28,32],[22,-26,32]]) puff(bx+ox*s-4, by+oy*s-4, r*s);
  puff(bx-95*s, by-14*s+Math.sin(t*5)*4*s, 13*s);
  // orange scarf where the neck leaves the body
  cx.fillStyle = '#ff7a1a'; cx.beginPath(); cx.ellipse(bx+48*s, by-28*s, 22*s, 12*s, -0.5, 0, 7); cx.fill();
  cx.beginPath(); cx.moveTo(bx+40*s, by-22*s); cx.lineTo(bx+30*s+Math.sin(t*6)*4*s, by+6*s); cx.lineTo(bx+44*s, by+2*s); cx.closePath(); cx.fill();
  // wooden name sign: 伸脖羊
  const sx = bx + 125*s, sy = gy - 46*s;
  cx.fillStyle = '#7a4a24'; cx.fillRect(sx-3, sy, 6, gy-sy);
  cx.fillStyle = '#c98a4b'; cx.beginPath(); cx.roundRect(sx-44*s, sy-26*s, 88*s, 30*s, 6); cx.fill();
  cx.strokeStyle = '#7a4a24'; cx.lineWidth = 2; cx.stroke();
  cx.fillStyle = '#fffdf7'; cx.font = '900 '+Math.floor(17*s)+'px "PingFang TC","Noto Sans TC",sans-serif'; cx.textAlign = 'center'; cx.fillText('伸脖羊', sx, sy-5*s);
}

// ---------- Taipei backdrop ----------
const SKY = [['#ffb067','#fff1dc'],['#ff8a3d','#ffd3a1'],['#3a2a6e','#ff9a5a'],['#141a44','#3a2a6e']];
const lerpC = (a,b,k)=>{ const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join(''); };
function skyCol(j){ const f = (camX/4000) % SKY.length, i = Math.floor(f), k = f - i; return lerpC(SKY[i][j], SKY[(i+1)%SKY.length][j], k); }
const nightness = () => { const f = (camX/4000) % SKY.length; return f<1 ? 0 : f<2 ? (f-1)*0.5 : f<3 ? 0.5+(f-2)*0.5 : 1-(f-3); };
function drawBackdrop(){
  const gy = groundY(), n = nightness();
  const g = cx.createLinearGradient(0,0,0,gy); g.addColorStop(0, skyCol(0)); g.addColorStop(1, skyCol(1)); cx.fillStyle = g; cx.fillRect(0,0,W,H);
  if (n > 0.3){ cx.fillStyle='#fff'; for (let i=0;i<50;i++){ cx.globalAlpha=(n-0.3)*(0.5+0.5*Math.sin(t*2+i)); cx.fillRect(rnd(i)*W, rnd(i+7)*gy*0.6, 2, 2); } cx.globalAlpha=1;
    cx.fillStyle='rgba(255,243,196,'+n+')'; cx.beginPath(); cx.arc(W*0.8, H*0.14, 26, 0, 7); cx.fill(); }
  // 洋流: wide flowing bands across the sky (parallax 0.05), with silver-foil glints like light on water
  for (const [k, col, amp, yy, thick] of [[0,'rgba(255,122,26,.55)',22,0.30,26],[1,'rgba(255,190,120,.55)',18,0.36,18],[2,'rgba(40,170,190,.45)',14,0.41,14]]){
    cx.beginPath();
    for (let x=-10; x<=W+10; x+=12){ const wx = x + camX*0.05 + t*(40+k*12); const y0 = gy*yy + Math.sin(wx*0.012 + k)*amp*S() + Math.sin(wx*0.031)*amp*0.35*S();
      x === -10 ? cx.moveTo(x, y0) : cx.lineTo(x, y0); }
    for (let x=W+10; x>=-10; x-=12){ const wx = x + camX*0.05 + t*(40+k*12); const y0 = gy*yy + thick*S() + Math.sin(wx*0.012 + k + 0.6)*amp*S() + Math.sin(wx*0.031)*amp*0.35*S();
      cx.lineTo(x, y0); }
    cx.closePath(); cx.fillStyle = col; cx.fill();
  }
  for (let i=0;i<26;i++){ const gx = (rnd(i)*W*1.3 - (camX*0.05 + t*50)) % (W*1.3); const x = gx < -20 ? gx + W*1.3 : gx;
    const y0 = gy*(0.29 + rnd(i+3)*0.14), a = Math.max(0, Math.sin(t*3 + i*1.7));
    cx.fillStyle = 'rgba(255,255,255,'+(a*0.9)+')'; cx.beginPath(); cx.moveTo(x, y0-5*a); cx.lineTo(x+2, y0); cx.lineTo(x, y0+5*a); cx.lineTo(x-2, y0); cx.fill(); }
  // 陽明山 (parallax 0.1)
  cx.fillStyle = lerpC('#e8a46c','#2a2140', n);
  cx.beginPath(); cx.moveTo(0, gy-120*S());
  for (let x=0;x<=W+20;x+=20){ const wx=x+camX*0.1; cx.lineTo(x, gy-150*S()-60*S()*Math.sin(wx*0.004)-30*S()*Math.sin(wx*0.011)); }
  cx.lineTo(W,gy); cx.lineTo(0,gy); cx.fill();
  // far skyline (parallax 0.35), with a far-off 101 every so often
  const far = lerpC('#d9b9a0','#3a2c58', n);
  for (let i=Math.floor(camX*0.35/46)-1; i<(camX*0.35+W)/46+1; i++){
    const x = i*46 - camX*0.35, h = (40 + rnd(i)*110)*S();
    cx.fillStyle = far; cx.fillRect(x, gy-h, 40, h);
    if (n>0.4){ cx.fillStyle='rgba(255,230,140,'+(n*0.7)+')'; for (let yy=gy-h+8; yy<gy-6; yy+=12) for (let xx=x+5; xx<x+36; xx+=10) if (rnd(i*31+yy+xx)>0.55) cx.fillRect(xx,yy,4,5); }
    if (i % 23 === 0) farTower(x+20, gy, far);
  }
  // 臺灣街屋 row (parallax 0.6) in front of the skyline
  streetRow(gy, n, 0.6);
  // street: red-brick sidewalk, curb markings (紅線/黃線/白線停車格), parking lane, two traffic lanes
  const rh = H - gy, sS = S();
  cx.fillStyle = lerpC('#6f7279','#2c2f38', n); cx.fillRect(0, gy, W, rh);
  cx.fillStyle = lerpC(mute('#b5674d', 0.4),'#4a2e2a', n); cx.fillRect(0, gy, W, 7*sS);

    for (let k = 0; k < 3; k++) if (rnd(i*11 + k) > 0.35) scooter(x + 14*s + k*bw*0.3, gy - 2*s, n, i + k, 0.42, rnd(i+k) > 0.5 ? 1 : -1, true);
  }
  cx.restore();
}
// moving scooter traffic, world-anchored so nothing pops: each lane drifts at its own speed
function traffic(y, n, speed, dir, spacing, sc, seed, carShare = 0.4){
  const off = camX - t*speed*dir;
  for (let i = Math.floor(off/spacing) - 1; i < (off + W)/spacing + 2; i++){
    if (rnd(i*3.7 + seed) < 0.35) continue;
    const x = i*spacing - off + rnd(i + seed)*spacing*0.3;
    if (rnd(i*8.9 + seed) < carShare){ car(x, y, n, i + seed, sc, dir); continue; }
    scooter(x, y + rnd(i*1.3 + seed)*4*S(), n, i + seed, sc*(0.9 + rnd(i*2.1 + seed)*0.2), dir);
    if (rnd(i*5.3 + seed) > 0.55) scooter(x + 30*S()*sc, y + 5*S(), n, i + seed + 2, sc*0.95, dir);   // scooters ride in packs
  }
}

// draw(x, top, w, gy, n, flip): fill [x, x+w] from `top` down to the base line `gy`.
// For the hanging (upside-down) ones the canvas is mirrored, so `flip` just turns off text.
const C = (d, nt, n) => lerpC(d, nt, n);
const brickBands = (x, y0, w, y1, n) => { cx.fillStyle = C('#f3efe6','#8a8780',n); for (let y=y0+14; y<y1-4; y+=26) cx.fillRect(x, y, w, 4); };
function sign(text, x, y, w, color, flip){ if (flip) return;
  cx.fillStyle = color; cx.beginPath(); cx.roundRect(x, y, w, 18*S(), 4); cx.fill();
  cx.fillStyle = '#fff'; cx.font = '900 '+Math.floor(11*S())+'px "PingFang TC","Noto Sans TC",sans-serif'; cx.textAlign='center'; cx.fillText(text, x+w/2, y+13*S()); }
// one window pane with a sill underneath and a glint across the glass (v1.12)
function pane(px, py, pw, ph, lit, col, n){
  cx.fillStyle = lit ? 'rgba(255,224,130,'+n+')' : col; cx.fillRect(px, py, pw, ph);
  if (pw < 3 || ph < 3) return;
  cx.fillStyle = 'rgba(0,0,0,.22)'; cx.fillRect(px - 0.5, py + ph, pw + 1, 1.2);                 // sill shadow
  if (!lit){ cx.fillStyle = 'rgba(255,255,255,' + (0.28 - n*0.18).toFixed(2) + ')';               // sky reflection
    cx.beginPath(); cx.moveTo(px, py + ph*0.7); cx.lineTo(px + pw*0.55, py); cx.lineTo(px + pw*0.85, py); cx.lineTo(px, py + ph); cx.fill(); }
}
function windowsGrid(x, y0, w, y1, n, col, dx=12, dy=14){ for (let y=y0; y<y1-6; y+=dy) for (let xx=x; xx<x+w-4; xx+=dx)
  pane(xx, y, dx*0.5, dy*0.5, n>0.4 && rnd(xx*1.3+y*0.7)>0.45, col, n); }

// ---------- 85 more Taipei City landmarks & scenery (compact drawing helpers) ----------
function G(x, top, w, gy, n, flip){
  const s = S(), H = gy - top;
  const dk = c => lerpC(c, '#141a2e', 0.62);
  const g = { x, top, w, gy, H, s, n, flip,
    c: col => lerpC(col, dk(col), n),
    X: u => x + u*w, F: v => gy - v*H, B: px => gy - Math.min(px*s, H), T: px => top + Math.min(px*s, H),
    m: (px, f) => Math.min(px*s, H*f),
  };
  g.R = (u0,u1,y0,y1,col) => { cx.fillStyle = g.c(col); cx.fillRect(g.X(Math.min(u0,u1)), Math.min(y0,y1), Math.abs(u1-u0)*w, Math.abs(y1-y0)); };
  g.P = (pts,col) => { cx.fillStyle = g.c(col); cx.beginPath(); pts.forEach(([u,y],i)=> i? cx.lineTo(g.X(u),y) : cx.moveTo(g.X(u),y)); cx.fill(); };
  g.L = (pts,col,lw=2) => { cx.strokeStyle = g.c(col); cx.lineWidth = lw; cx.lineCap='round'; cx.beginPath(); pts.forEach(([u,y],i)=> i? cx.lineTo(g.X(u),y) : cx.moveTo(g.X(u),y)); cx.stroke(); };
  g.C = (u,y,r,col) => { cx.fillStyle = g.c(col); cx.beginPath(); cx.arc(g.X(u), y, r, 0, 7); cx.fill(); };
  g.E = (u,y,ru,ry,col,half) => { cx.fillStyle = g.c(col); cx.beginPath(); cx.ellipse(g.X(u), y, ru*w, ry, 0, half?Math.PI:0, half?0:7); cx.fill(); };
  g.roof = (u0,u1,y,h,col,curl=1) => { const a=g.X(u0), b=g.X(u1), k=(b-a)*0.14;   // Chinese eave with upturned ends
    cx.fillStyle = g.c(col); cx.beginPath(); cx.moveTo(a-6*curl, y-h*0.25*curl); cx.quadraticCurveTo(a+k*0.6, y, a+k, y-h);
    cx.lineTo(b-k, y-h); cx.quadraticCurveTo(b-k*0.6, y, b+6*curl, y-h*0.25*curl); cx.lineTo(b-k*0.4, y); cx.lineTo(a+k*0.4, y); cx.fill();
    if (h > 6){ cx.save(); cx.clip(); cx.strokeStyle = 'rgba(0,0,0,.16)'; cx.lineWidth = 1;          // tile rows (v1.12)
      for (let xx = a + 3; xx < b; xx += 4*s){ cx.beginPath(); cx.moveTo(xx, y - h); cx.lineTo(xx + (xx - (a+b)/2)*0.08, y); cx.stroke(); }
      cx.restore(); cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(a+k, y-h, b-a-2*k, Math.max(1.5, 1.5*s));   // ridge highlight
      cx.fillStyle = 'rgba(0,0,0,.25)'; cx.fillRect(a+k*0.4, y-1.5, b-a-k*0.8, 1.5); } };
  g.win = (u0,u1,y0,y1,col,dx=12,dy=14) => { for (let yy=Math.min(y0,y1)+4; yy<Math.max(y0,y1)-dy*0.5; yy+=dy) for (let xx=g.X(u0)+3; xx<g.X(u1)-dx*0.5; xx+=dx){
    pane(xx, yy, dx*0.5, dy*0.5, n>0.4 && rnd(xx*1.7+yy*0.3)>0.45, g.c(col), n); } };
  g.bands = (u0,u1,y0,y1,col,step=24) => { for (let yy=Math.min(y0,y1)+step*0.5; yy<Math.max(y0,y1); yy+=step) g.R(u0,u1,yy,yy+3,col); };
  g.cols = (u0,u1,y0,y1,k,col,cw=0.04) => { for (let i=0;i<k;i++){ const u=u0+(u1-u0)*(k===1?0.5:i/(k-1)); g.R(u-cw/2,u+cw/2,y0,y1,col); } };
  g.arch = (u,y,wu,h,col) => { cx.fillStyle = g.c(col); cx.beginPath(); const a=g.X(u-wu/2), b=g.X(u+wu/2);
    cx.moveTo(a,y); cx.lineTo(a,y-h+(b-a)/2); cx.arc((a+b)/2, y-h+(b-a)/2, (b-a)/2, Math.PI, 0); cx.lineTo(b,y); cx.fill(); };
  g.tree = (u,y,r,col='#3f9a4a',trunk='#6b4423') => { g.R(u-0.02,u+0.02,y,y-r*1.2,trunk); g.C(u,y-r*1.4,r,col); g.C(u-0.06,y-r*1.1,r*0.75,col); g.C(u+0.06,y-r*1.1,r*0.75,col); };
  g.lant = (u,y) => { g.E(u,y,0.035,6*s,'#e53935'); if (n>0.3){ cx.fillStyle='rgba(255,120,80,'+n*0.35+')'; cx.beginPath(); cx.arc(g.X(u),y,10*s,0,7); cx.fill(); } };
  g.sign = (text,u0,u1,y,col) => sign(text, g.X(u0), y, (u1-u0)*w, g.c(col), flip);
  g.stones = (u0,u1,y0,y1,rowH=9) => { const a=g.X(u0), b=g.X(u1), lo=Math.min(y0,y1), hi=Math.max(y0,y1), rh=rowH*s;   // ashlar block joints
    cx.save(); cx.beginPath(); cx.rect(a, lo, b-a, hi-lo); cx.clip(); cx.strokeStyle = 'rgba(40,28,20,.22)'; cx.lineWidth = 1;
    for (let yy=hi, r=0; yy>lo; yy-=rh, r++){ cx.beginPath(); cx.moveTo(a, yy); cx.lineTo(b, yy); cx.stroke();
      for (let xx=a+(r%2? rh: rh*2); xx<b; xx+=rh*2.4){ cx.beginPath(); cx.moveTo(xx, yy); cx.lineTo(xx, yy-rh); cx.stroke(); } }
    cx.restore(); };
  g.ground = (col) => g.R(0,1,gy-g.m(10,0.08),gy,col);
  return g;
}

function drawNeckAndHead(){

  { const l = pts[pts.length-1]; pts.push({ x: hx, y: hy, d: l.d + Math.hypot(hx-l.x, hy-l.y) }); }

  const STEP = 5*s;

      if (Math.max(a.x,c.x) < -40 || Math.min(a.x,c.x) > W+40) continue;
      const nx = -(c.y-a.y)/L, ny = (c.x-a.x)/L;

  walk((x,y0,nx,ny,k) => { for (const side of [1,-1]){ const j = rnd(k*2+(side>0?1:0)), r = (3.2 + j*2.6)*s, off = thick + (0.5 + j*2)*s;

  // 4) a gentle belly shade and fine hairs on the edge
  walk((x,y0,nx,ny,k,tx,ty) => { if (k%2) return; const side = ny > 0 ? 1 : -1, j = rnd(k*3.1);
      cx.strokeStyle = 'rgba(190,180,160,.45)'; cx.lineWidth = 1.1*s; cx.beginPath();

  cx.fillStyle='#ff8fa3'; cx.beginPath(); cx.ellipse(-22,0,14,4,0,0,7); cx.fill(); cx.restore();

function hitSil(o){

    if (!solid[i]){ d[p+3] = 0; continue; }
    const b = boxes[yy < gapMid ? 0 : 1]; if (xx<b[0]) b[0]=xx; if (yy<b[1]) b[1]=yy; if (xx>b[2]) b[2]=xx; if (yy>b[3]) b[3]=yy;

    if (edge){ d[p]=255; d[p+1]=23; d[p+2]=68; d[p+3]=255; } else { d[p]=255; d[p+1]=23; d[p+2]=68; d[p+3]=34; } }

function devBox(x0, y0, x1, y1, col){   // layout-bounds rectangle with corner ticks
  cx.strokeStyle = col; cx.lineWidth = 1; cx.strokeRect(Math.round(x0)+0.5, Math.round(y0)+0.5, x1-x0, y1-y0);
  const k = 7; cx.strokeStyle = DEV.blue; cx.lineWidth = 2; cx.beginPath();

}
function devLabel(text, x, y, col){ cx.font = DEV.mono; const w = cx.measureText(text).width + 8;

}

        $('lbMsg').textContent = (r.saved ? '🎉 已自動更新排行榜（' + name + '）：第 ' + r.rank + ' 名' : '排行榜保留你之前的 ' + r.best + ' 分（第 ' + r.rank + ' 名）') + '・名字打錯可以在下面改';
        mode = 'rename'; $('nameIn').value = name; $('sendBtn').textContent = '改名字'; $('lbForm').classList.add('on');
      }).catch(e => { if (e && (e.code === 'rejected' || e.code === 'robot')){ $('lbMsg').textContent = e.code === 'robot' ? '這局沒有通過「我不是機器人」驗證，不能上榜' : '這局的分數沒有通過檢查，沒有上榜'; return; } if (e && e.code === 'pending'){ $('lbMsg').textContent = '網路不穩，成績先存在這台裝置，下次打開遊戲會自動補上傳'; return; }
        if (e && e.code === 'ticket'){ $('lbMsg').textContent = '這局開始時連不上排行榜，沒拿到上傳憑證，這局沒辦法上榜'; return; }
        $('lbMsg').textContent = '自動更新失敗，可以手動上傳'; $('lbForm').classList.add('on'); });
    }
  };
  $('sendBtn').onclick = async () => {
    const name = $('nameIn').value.trim().slice(0,12);
    if (!name){ $('lbMsg').textContent = '先輸入名字喔'; return; }
    if (mode === 'rename'){
      if (name === savedName()){ $('lbMsg').textContent = '名字沒有改變喔'; return; }
      $('sendBtn').disabled = true; $('lbMsg').textContent = '改名中…';
      try{ await window.LB.rename(name); ls('sheepName', name); $('lbMsg').textContent = '✏️ 排行榜上的名字已改成「' + name + '」'; $('lbForm').classList.remove('on'); }
      catch(e){ $('lbMsg').textContent = '改名失敗，請稍後再試'; }
      $('sendBtn').disabled = false; return;
    }
    ls('sheepName', name);
    $('sendBtn').disabled = true; $('lbMsg').textContent = '上傳中…';
    try{
      const r = await window.LB.submit(name, lastScore); remember(lastScore, r);
      $('lbMsg').textContent = r.saved ? '🎉 已上榜！之後破紀錄會自動更新，目前第 ' + r.rank + ' 名' : '你之前的紀錄 ' + r.best + ' 分比較高，排行榜保留最高分（第 ' + r.rank + ' 名）';
      $('lbForm').classList.remove('on');
    }catch(e){ $('lbMsg').textContent = e && e.code === 'rejected' ? '這局的分數沒有通過檢查，沒有上榜' : e && e.code === 'robot' ? '這局沒有通過「我不是機器人」驗證，不能上榜' : e && e.code === 'ticket' ? '這局開始時連不上排行榜或已超過 6 小時，這局沒辦法上榜' : e && e.code === 'pending' ? '網路不穩，成績先存在這台裝置，下次打開遊戲會自動補上傳' : '上傳失敗，請稍後再試'; }
    $('sendBtn').disabled = false;
  };
  const openBoard = async () => {
    $('board').classList.add('on'); $('boardList').innerHTML = ''; $('boardNote').textContent = '讀取中…';
    try{
      const rows = await window.LB.top(20), me = window.LB.pid;
      rows.forEach((r,i) => { const li = document.createElement('li'); if (r.id === me) li.className = 'me';
        const rk = document.createElement('span'); rk.className='rk'; rk.textContent = ['🥇','🥈','🥉'][i] || (i+1);
        const nm = document.createElement('span'); nm.className='nm'; nm.textContent = r.name;
        const sc = document.createElement('span'); sc.className='sc'; sc.textContent = r.score;
        li.append(rk, nm, sc); $('boardList').appendChild(li); });
      $('boardNote').textContent = rows.length ? '每台裝置保留最高分・前 20 名' : '還沒有人上榜，快來搶第一！';
    }catch(e){ $('boardNote').textContent = '讀取失敗，請稍後再試'; }
  };
  $('boardBtn').onclick = openBoard; $('boardBtn2').onclick = openBoard;
  $('boardClose').onclick = () => $('board').classList.remove('on');
  window.enableBoard = () => { $('boardBtn').style.display = ''; };
})();
window.showStats = (plays, players) => {
  const txt = '🎮 已被玩 ' + plays.toLocaleString() + ' 次　👥 ' + players.toLocaleString() + ' 人玩過';
  document.getElementById('statsReady').textContent = txt;
  document.getElementById('statsPanel').textContent = txt;
};
</script>
<script>
// Stats + global leaderboard, stored in a Google Sheet in the owner's Drive via Apps Script.
// If SHEET_API is empty the game simply runs without them.
(function(){
  const API = window.SHEET_API; if (!API) return;
  const call = (params, write) => write
    ? fetch(API, { method:'POST', body: JSON.stringify(params), headers:{ 'Content-Type':'text/plain;charset=utf-8' } }).then(r => r.json())
    : fetch(API + '?' + new URLSearchParams(params)).then(r => r.json());
  const show = v => { if (v && typeof v.plays === 'number') window.showStats(v.plays, v.players); };
  let pid = null; try{ pid = localStorage.getItem('sheepPid'); }catch(_){}
  if (!pid){                                   // first visit on this device/browser = a new player
    pid = (crypto.randomUUID ? crypto.randomUUID() : 'p' + String(Math.random()).slice(2));
    try{ localStorage.setItem('sheepPid', pid); }catch(_){}
    call({ action:'player' }, true).then(show).catch(()=>{});
  } else call({ action:'stats' }).then(show).catch(()=>{});
  let ticket = null;   // one-use ticket for this run, handed out by the server when the run starts
  // v1.12.1: a flaky connection at the start of a run used to leave it without a ticket (so it could never be uploaded),
  // and a dropped upload was simply lost. Now the ticket is retried, the upload waits for it, network failures are
  // retried, and an upload that still can't get through is kept on the device and sent the next time the game opens.
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let ticketP = null;
  window.onGameStart = () => { ticket = null;
    const p = ticketP = (async () => { for (const wait of [0, 1500, 4000, 8000]){ if (wait) await sleep(wait);
      let r = null; try{ r = await call({ action:'start', pid }, true); }catch(_){}
      if (r && r.ticket){ if (ticketP === p) ticket = r.ticket; try{ show(r); }catch(_){} return r.ticket; } } return null; })(); };
  const lsx = (k, v) => { try{ if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(_){ return null; } };
  async function send(body){            // retries network failures; server answers (including errors) come straight back
    for (const wait of [0, 1500, 4000]){ if (wait) await sleep(wait); try{ return await call(body, true); }catch(_){} }
    throw Object.assign(new Error('network'), { code: 'network' });
  }
  async function flushPending(){
    let p = null; try{ p = JSON.parse(lsx('sheepPending') || 'null'); }catch(_){}
    if (!p || Date.now() - p.at > 5.5*3600e3){ lsx('sheepPending', null); return null; }   // tickets last 6 hours
    try{ const r = await send(p.body); lsx('sheepPending', null); return r.error ? null : { ...r, score: p.body.score, name: p.body.name }; }catch(_){ return null; }
  }
  window.LB_flushPending = flushPending;
  window.LB = {
    pid,
    async submit(name, score){
      const myP = ticketP, run = runStats();                       // this run's ticket, even if the player has already started the next one
      const tk = ticket || (myP ? await Promise.race([myP, sleep(15000).then(() => null)]) : null);
      const body = { action:'submit', pid, name, score, ticket: tk, run };
      let r; try{ r = await send(body); }
      catch(e){ if (tk) lsx('sheepPending', JSON.stringify({ at: Date.now(), body })); throw Object.assign(new Error('network'), { code: tk ? 'pending' : 'network' }); }
      if (r.error) throw Object.assign(new Error(r.error), { code: r.error }); return r; },
    async rename(name){ const r = await call({ action:'rename', pid, name }, true); if (r.error) throw Object.assign(new Error(r.error), { code: r.error }); return r; },
    async top(n){ const r = await call({ action:'top', pid, n }); return (r.rows || []).filter(x => x.name && +x.score > 0).map(x => ({ id: x.me ? pid : '', name: String(x.name), score: +x.score || 0 })); },
  };
  setTimeout(() => flushPending().then(r => { if (r && r.saved){ try{ localStorage.setItem('sheepLbBest', String(Math.max(r.score, +localStorage.getItem('sheepLbBest') || 0))); }catch(_){} } }), 1500);   // finish an upload a bad connection interrupted
  window.enableBoard();
})();
</script>
