<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>伸脖羊飛臺北</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;touch-action:none}
  #score{position:fixed;top:54px;left:12px;line-height:1;color:#fff;font-size:34px;font-weight:900;pointer-events:none;padding:0 4px;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.45)}
  #neck:empty{display:none}
  #neck{position:fixed;top:92px;left:12px;text-align:left;padding:0 4px;color:#fff;font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 6px rgba(0,0,0,.5)}
  #panel{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,1.5,.4,1);
    background:#fffaf0;border-radius:24px;padding:22px 28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);color:#3b2a1a;min-width:210px;max-width:92vw;box-sizing:border-box;padding-left:18px;padding-right:18px}
  #panel.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  #lbForm{display:none;gap:6px;margin:10px 0 2px} #lbForm.on{display:flex}
  #nameIn{flex:1;min-width:0;padding:8px 10px;border-radius:12px;border:2px solid #2b2b2b;font-size:15px;font-weight:700}
  .pbtn{padding:8px 12px;border-radius:12px;border:2.5px solid #2b2b2b;background:#ffd23f;font-weight:900;font-size:14px;box-shadow:0 3px 0 #2b2b2b;cursor:pointer}
  .pbtn.alt{background:#fff} .btnrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
  #lbMsg{font-size:13px;color:#d6336c;font-weight:800;min-height:1em;margin-top:4px}
  #boardBtn{pointer-events:auto;margin:4px 0 14px}
  #board{position:fixed;inset:0;z-index:20;background:rgba(20,26,46,.55);display:none;align-items:center;justify-content:center}
  #board.on{display:flex}
  #board .card{background:#fffaf0;border-radius:22px;padding:18px 20px;width:min(86vw,340px);max-height:80vh;overflow:auto;color:#3b2a1a;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  #board h2{margin:0 0 10px;text-align:center;font-size:22px}
  #boardList{list-style:none;margin:0;padding:0}
  #boardList li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed #e3d6c3;font-weight:800}
  #boardList li .rk{width:30px;text-align:center;font-size:16px} #boardList li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #boardList li .sc{color:#ff6f9c;font-size:18px} #boardList li.me{background:#fff0c2;border-radius:10px}
  #boardNote{text-align:center;color:#8a7a6a;font-size:13px;margin:10px 0}
  #panel h1{margin:0 0 6px;font-size:min(6.2vw,28px);white-space:nowrap} #pn{white-space:nowrap;font-size:min(3.8vw,15px)} #panel .row{display:flex;justify-content:space-around;margin:12px 0;font-weight:800}
  #panel .row b{display:block;font-size:30px;color:#ff6f9c} #panel p{margin:8px 0 0;color:#8a7a6a;font-size:14px}
  #ready{position:fixed;left:0;right:0;top:16%;text-align:center;color:#fff;font-weight:900;font-size:19px;pointer-events:none;line-height:1.6;
    text-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity .3s, transform .3s}
  #ready.off{opacity:0;transform:translateY(-20px)}
  #ready .logo{font-size:min(19vw,92px);letter-spacing:.04em;line-height:1.1;margin-bottom:2px}
  #ready .logo span{display:inline-block;color:#fffdf7;-webkit-text-stroke:3px #2b2b2b;paint-order:stroke fill;text-shadow:0 6px 0 #ff6f9c, 0 10px 18px rgba(0,0,0,.25);
    animation:bob 1.6s ease-in-out infinite}
  #ready .logo span:nth-child(2){animation-delay:.15s} #ready .logo span:nth-child(3){animation-delay:.3s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  #ready .sub{font-size:16px;letter-spacing:.3em;margin-bottom:18px;color:#ffe3ec}
  #badge{position:fixed;top:12px;left:12px;background:#fffdf7;color:#2b2b2b;font-weight:900;font-size:15px;padding:6px 12px;border-radius:16px;
    border:2.5px solid #2b2b2b;box-shadow:0 3px 0 #ff6f9c;pointer-events:none}
  .stats{font-size:15px;margin:-8px 0 14px;color:#fff;letter-spacing:.05em}
  .stats2{font-size:13px;color:#8a7a6a;margin-top:6px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">0</div>
<div id="neck"></div>
<div id="badge">🐑 伸脖羊</div>
<div id="ready"><div class="logo"><span>伸</span><span>脖</span><span>羊</span></div><div class="sub">飛 越 臺 北</div>
<div class="stats" id="statsReady"></div><button class="pbtn" id="boardBtn" style="display:none">🏆 全域排行榜</button><br>👆 點一下，羊頭就往上跳<br><span style="font-size:15px">身體留在原地，脖子一路伸長穿過臺北地標</span></div>
<div id="panel"><h1>🐑 伸脖羊：「晚安！」</h1><div class="row"><div>分數<b id="ps">0</b></div><div>最佳<b id="pb">0</b></div></div><div id="pn"></div><div class="stats2" id="statsPanel"></div>
<div id="lbForm"><input id="nameIn" maxlength="12" placeholder="輸入名字上排行榜" autocomplete="nickname"><button class="pbtn" id="sendBtn">上傳</button></div>
<div id="lbMsg"></div>
<div class="btnrow"><button class="pbtn alt" id="boardBtn2" style="display:none">🏆 排行榜</button><button class="pbtn" id="againBtn">再玩一次</button></div></div>
<div id="board"><div class="card"><h2>🏆 全域排行榜</h2><ol id="boardList"></ol><div id="boardNote">讀取中…</div>
<div class="btnrow"><button class="pbtn" id="boardClose">關閉</button></div></div></div>
<script>
const cv = document.getElementById('c'); let cx = cv.getContext('2d');
let W, H, DPR;
function resize(){ DPR = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();
const PX_PER_M = 60;
const S = () => Math.min(1.1, Math.max(0.75, H/760));
const groundY = () => H*0.86;
const rnd = n => { const x = Math.sin(n*127.1)*43758.5453; return x-Math.floor(x); };
let camX = 0, t = 0;

// ---------- body, fixed at the starting point ----------
const BODY_X = () => 80*S();                                  // world x of the body
const neckBase = () => ({ x: BODY_X() + 55*S(), y: groundY() - 120*S() });
function puff(x,y,r,fill='#fffdf7'){ cx.fillStyle=fill; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill(); }
function drawBody(){
  const s = S(), bx = BODY_X() - camX, gy = groundY(); if (bx < -200) return;
  cx.fillStyle='#2b2b2b'; for (const lx of [-60,-30,20,50]) cx.fillRect(bx+lx*s-6, gy-75*s, 12*s, 75*s);
  cx.fillStyle='rgba(0,0,0,.15)'; cx.beginPath(); cx.ellipse(bx, gy+3, 95*s, 9*s, 0, 0, 7); cx.fill();
  const by = gy - 100*s;
  for (const [ox,oy,r] of [[0,0,50],[-48,6,42],[44,2,40],[-20,-28,38],[22,-26,38],[0,20,38]]) puff(bx+ox*s, by+oy*s, r*s, '#eeeae0');
  for (const [ox,oy,r] of [[0,0,44],[-48,6,36],[44,2,34],[-20,-28,32],[22,-26,32]]) puff(bx+ox*s-4, by+oy*s-4, r*s);
  puff(bx-95*s, by-14*s+Math.sin(t*5)*4*s, 13*s);
  // wooden name sign: 伸脖羊
  const sx = bx + 125*s, sy = gy - 46*s;
  cx.fillStyle = '#7a4a24'; cx.fillRect(sx-3, sy, 6, gy-sy);
  cx.fillStyle = '#c98a4b'; cx.beginPath(); cx.roundRect(sx-44*s, sy-26*s, 88*s, 30*s, 6); cx.fill();
  cx.strokeStyle = '#7a4a24'; cx.lineWidth = 2; cx.stroke();
  cx.fillStyle = '#fffdf7'; cx.font = '900 '+Math.floor(17*s)+'px "PingFang TC","Noto Sans TC",sans-serif'; cx.textAlign = 'center'; cx.fillText('伸脖羊', sx, sy-5*s);
}

// ---------- Taipei backdrop ----------
const SKY = [['#6ec6ff','#d9f1ff'],['#ff9f7a','#ffd9a8'],['#2a2f6e','#7a5a9a'],['#0b1440','#27306a']];
const lerpC = (a,b,k)=>{ const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join(''); };
function skyCol(j){ const f = (camX/4000) % SKY.length, i = Math.floor(f), k = f - i; return lerpC(SKY[i][j], SKY[(i+1)%SKY.length][j], k); }
const nightness = () => { const f = (camX/4000) % SKY.length; return f<1 ? 0 : f<2 ? (f-1)*0.5 : f<3 ? 0.5+(f-2)*0.5 : 1-(f-3); };
function drawBackdrop(){
  const gy = groundY(), n = nightness();
  const g = cx.createLinearGradient(0,0,0,gy); g.addColorStop(0, skyCol(0)); g.addColorStop(1, skyCol(1)); cx.fillStyle = g; cx.fillRect(0,0,W,H);
  if (n > 0.3){ cx.fillStyle='#fff'; for (let i=0;i<50;i++){ cx.globalAlpha=(n-0.3)*(0.5+0.5*Math.sin(t*2+i)); cx.fillRect(rnd(i)*W, rnd(i+7)*gy*0.6, 2, 2); } cx.globalAlpha=1;
    cx.fillStyle='rgba(255,243,196,'+n+')'; cx.beginPath(); cx.arc(W*0.8, H*0.14, 26, 0, 7); cx.fill(); }
  // 陽明山 (parallax 0.1)
  cx.fillStyle = lerpC('#7fb38a','#1d2b40', n);
  cx.beginPath(); cx.moveTo(0, gy-120*S());
  for (let x=0;x<=W+20;x+=20){ const wx=x+camX*0.1; cx.lineTo(x, gy-150*S()-60*S()*Math.sin(wx*0.004)-30*S()*Math.sin(wx*0.011)); }
  cx.lineTo(W,gy); cx.lineTo(0,gy); cx.fill();
  // far skyline (parallax 0.35), with a far-off 101 every so often
  const far = lerpC('#9fb3c8','#2a3558', n);
  for (let i=Math.floor(camX*0.35/46)-1; i<(camX*0.35+W)/46+1; i++){
    const x = i*46 - camX*0.35, h = (40 + rnd(i)*110)*S();
    cx.fillStyle = far; cx.fillRect(x, gy-h, 40, h);
    if (n>0.4){ cx.fillStyle='rgba(255,230,140,'+(n*0.7)+')'; for (let yy=gy-h+8; yy<gy-6; yy+=12) for (let xx=x+5; xx<x+36; xx+=10) if (rnd(i*31+yy+xx)>0.55) cx.fillRect(xx,yy,4,5); }
    if (i % 23 === 0) farTower(x+20, gy, far);
  }
  // street
  cx.fillStyle = lerpC('#6b6f78','#2c2f38', n); cx.fillRect(0, gy, W, H-gy);
  cx.fillStyle = lerpC('#8d9099','#3a3d47', n); cx.fillRect(0, gy, W, 8);
  cx.fillStyle = 'rgba(255,255,255,.7)'; for (let x = -((camX)%60); x<W; x+=60) cx.fillRect(x, gy + (H-gy)*0.55, 30, 4);
  // street lamps + scooters
  for (let i=Math.floor(camX/180)-1; i<(camX+W)/180+1; i++){
    const x = i*180 - camX + 40; cx.fillStyle='#3a3d47'; cx.fillRect(x, gy-70*S(), 4, 70*S()); cx.fillRect(x, gy-70*S(), 18, 4);
    if (n>0.3){ cx.fillStyle='rgba(255,230,150,'+n+')'; cx.beginPath(); cx.arc(x+18, gy-66*S(), 6, 0, 7); cx.fill(); }
    if (rnd(i*9) > 0.55) scooter(i*180 - camX + 110 - ((t*60*(1+rnd(i)))%180), gy + (H-gy)*0.35, n, i);
  }
}
function farTower(x, gy, col){ cx.fillStyle = col; const s = S()*0.8;
  for (let k=0;k<8;k++){ const yb = gy - 60*s - k*22*s; cx.beginPath(); cx.moveTo(x-12*s, yb); cx.lineTo(x+12*s, yb); cx.lineTo(x+16*s, yb-22*s); cx.lineTo(x-16*s, yb-22*s); cx.fill(); }
  cx.fillRect(x-16*s, gy-60*s, 32*s, 60*s); cx.fillRect(x-1.5, gy-60*s-8*22*s-40*s, 3, 40*s); }
function scooter(x, y, n, i){ const c = ['#ff6f61','#4fa3ff','#ffd23f','#7ad97a'][i%4];
  cx.fillStyle='#222'; cx.beginPath(); cx.arc(x, y, 6, 0, 7); cx.arc(x+26, y, 6, 0, 7); cx.fill();
  cx.fillStyle=c; cx.beginPath(); cx.roundRect(x-4, y-14, 34, 10, 4); cx.fill();
  cx.fillStyle='#333'; cx.fillRect(x+8, y-30, 8, 16); cx.fillStyle=c; cx.beginPath(); cx.arc(x+12, y-34, 6, 0, 7); cx.fill();
  if (n>0.3){ cx.fillStyle='rgba(255,250,200,.9)'; cx.beginPath(); cx.arc(x+32, y-10, 3, 0, 7); cx.fill(); } }

// ---------- Taipei landmarks ----------
// draw(x, top, w, gy, n, flip): fill [x, x+w] from `top` down to the base line `gy`.
// For the hanging (upside-down) ones the canvas is mirrored, so `flip` just turns off text.
const C = (d, nt, n) => lerpC(d, nt, n);
const brickBands = (x, y0, w, y1, n) => { cx.fillStyle = C('#f3efe6','#8a8780',n); for (let y=y0+14; y<y1-4; y+=26) cx.fillRect(x, y, w, 4); };
function sign(text, x, y, w, color, flip){ if (flip) return;
  cx.fillStyle = color; cx.beginPath(); cx.roundRect(x, y, w, 18*S(), 4); cx.fill();
  cx.fillStyle = '#fff'; cx.font = '900 '+Math.floor(11*S())+'px "PingFang TC","Noto Sans TC",sans-serif'; cx.textAlign='center'; cx.fillText(text, x+w/2, y+13*S()); }
function windowsGrid(x, y0, w, y1, n, col, dx=12, dy=14){ for (let y=y0; y<y1-6; y+=dy) for (let xx=x; xx<x+w-4; xx+=dx){
  cx.fillStyle = n>0.4 && rnd(xx*1.3+y*0.7)>0.45 ? 'rgba(255,224,130,'+n+')' : col; cx.fillRect(xx, y, dx*0.5, dy*0.5); } }

const LANDMARKS = [
  { name:'台北 101', wm:1.0, maxH:9999,
    draw(x, top, w, gy, n){ const s=S(), H=gy-top, base=Math.min(0.16*H, 70*s), tiers=8, spire=Math.min(40*s, H*0.12), tierH=(H-base-spire)/(tiers+1.3);
      const glass = C('#5f9e98','#2f5f6a',n);
      cx.fillStyle = C('#7aa9a3','#3b6a72',n); cx.fillRect(x+w*0.12, gy-base, w*0.76, base);
      cx.strokeStyle = C('#e8c45a','#a8872f',n); cx.lineWidth = 2; cx.beginPath(); cx.arc(x+w*0.5, gy-base*0.55, Math.min(base*0.3, w*0.12), 0, 7); cx.stroke();  // 如意 / coin ornament
      for (let k=0;k<tiers;k++){ const yb = gy-base-k*tierH;
        cx.fillStyle = glass; cx.beginPath(); cx.moveTo(x+w*0.2, yb); cx.lineTo(x+w*0.8, yb); cx.lineTo(x+w*0.92, yb-tierH); cx.lineTo(x+w*0.08, yb-tierH); cx.fill();
        cx.fillStyle = 'rgba(255,255,255,.25)'; cx.fillRect(x+w*0.08, yb-tierH, w*0.84, 2.5);
        if (n>0.3){ cx.fillStyle = ['rgba(255,90,90,','rgba(255,200,80,','rgba(120,220,120,','rgba(120,170,255,'][k%4]+n*0.6+')'; cx.fillRect(x+w*0.25, yb-tierH*0.55, w*0.5, 2.5); } }
      const yt = gy-base-tiers*tierH; cx.fillStyle = glass; cx.fillRect(x+w*0.32, yt-tierH*1.3, w*0.36, tierH*1.3);
      cx.fillStyle = '#d3dcdc'; cx.fillRect(x+w*0.47, top, w*0.06, yt-tierH*1.3-top); },
    hit:(x,top,w,gy)=>{ const H=gy-top, spire=Math.min(40*S(), H*0.12); return [[x+w*0.08, top+spire, w*0.84],[x+w*0.44, top, w*0.12]]; } },

  { name:'圓山大飯店', wm:1.15, maxH:9999,
    draw(x, top, w, gy, n){ const s=S(), floors=Math.max(2, Math.floor((gy-top)/(46*s))), fh=(gy-top)/floors;
      for (let k=0;k<floors;k++){ const yb=gy-k*fh;
        cx.fillStyle = C('#c8322f','#7a1e1e',n); cx.fillRect(x+w*0.12, yb-fh+12*s, w*0.76, fh-12*s);
        cx.fillStyle = C('#f3d9a0','#806a40',n); for (let c=0;c<6;c++) cx.fillRect(x+w*(0.15+c*0.13), yb-fh+18*s, w*0.04, fh-22*s);
        cx.fillStyle = C('#f2b632','#a8771c',n); cx.beginPath();
        cx.moveTo(x-6, yb-fh+16*s); cx.quadraticCurveTo(x+w*0.15, yb-fh+8*s, x+w*0.2, yb-fh); cx.lineTo(x+w*0.8, yb-fh);
        cx.quadraticCurveTo(x+w*0.85, yb-fh+8*s, x+w+6, yb-fh+16*s); cx.lineTo(x+w*0.85, yb-fh+12*s); cx.lineTo(x+w*0.15, yb-fh+12*s); cx.fill(); } },
    hit:(x,top,w)=>[[x, top, w]] },

  { name:'中正紀念堂', wm:1.15, maxH:9999,
    draw(x, top, w, gy, n){ const s=S(), H=gy-top, roofH=Math.min(70*s, H*0.35);
      cx.fillStyle = C('#f4f4f0','#8d8f99',n); cx.fillRect(x+w*0.1, top+roofH, w*0.8, H-roofH);
      cx.fillStyle = C('#e2e2dc','#777a85',n); for (let k=0;k<6;k++) cx.fillRect(x+w*(0.02+k*0.04), gy-(k+1)*6*s, w*(0.96-k*0.08), 6*s);
      cx.fillStyle = C('#c9a84a','#7a6530',n); cx.fillRect(x+w*0.4, gy-36*s-36*s, w*0.2, 36*s);
      cx.fillStyle = C('#2d5fb3','#1b3466',n);
      cx.beginPath(); cx.moveTo(x, top+roofH); cx.lineTo(x+w*0.18, top+roofH*0.55); cx.lineTo(x+w*0.82, top+roofH*0.55); cx.lineTo(x+w, top+roofH); cx.fill();
      cx.beginPath(); cx.moveTo(x+w*0.12, top+roofH*0.55); cx.lineTo(x+w*0.5, top+6*s); cx.lineTo(x+w*0.88, top+roofH*0.55); cx.fill();
      cx.fillStyle = C('#f2b632','#a8771c',n); cx.beginPath(); cx.arc(x+w*0.5, top+6*s, 6*s, 0, 7); cx.fill(); },
    hit:(x,top,w,gy)=>[[x, top+Math.min(70*S(),(gy-top)*0.35)*0.5, w],[x+w*0.4, top, w*0.2]] },

  { name:'國父紀念館', wm:1.35, maxH:260,
    draw(x, top, w, gy, n){ const s=S(), H=gy-top, roofH=Math.min(46*s, H*0.35);
      cx.fillStyle = C('#efe6d2','#7d776a',n); cx.fillRect(x+w*0.06, top+roofH, w*0.88, H-roofH);
      cx.fillStyle = C('#9a9a9a','#4a4a50',n); for (let c=0;c<7;c++) cx.fillRect(x+w*(0.08+c*0.135), top+roofH, w*0.05, H-roofH);   // gray columns
      cx.fillStyle = C('#e9b42a','#9c7417',n);                                                                                         // yellow-tiled roof, centre sweeps up
      cx.beginPath(); cx.moveTo(x-4, top+roofH); cx.lineTo(x+w*0.3, top+roofH*0.55); cx.quadraticCurveTo(x+w*0.5, top+roofH*0.45, x+w*0.44, top);
      cx.quadraticCurveTo(x+w*0.5, top+roofH*0.25, x+w*0.56, top); cx.quadraticCurveTo(x+w*0.5, top+roofH*0.45, x+w*0.7, top+roofH*0.55); cx.lineTo(x+w+4, top+roofH); cx.fill();
      cx.fillStyle = 'rgba(0,0,0,.15)'; cx.fillRect(x-4, top+roofH-4*s, w+8, 4*s); },
    hit:(x,top,w,gy)=>[[x, top+Math.min(46*S(),(gy-top)*0.35)*0.5, w],[x+w*0.42, top, w*0.16]] },

  { name:'北門', wm:1.1, maxH:220,
    draw(x, top, w, gy, n){ const s=S(), H=gy-top, wallTop=top+Math.min(70*s, H*0.45);
      cx.fillStyle = C('#b8a68e','#5e5548',n); cx.fillRect(x, wallTop, w, gy-wallTop);
      cx.fillStyle = 'rgba(0,0,0,.13)'; for (let y=wallTop+10; y<gy; y+=14) for (let xx=x+((y/14|0)%2)*9; xx<x+w; xx+=18) cx.fillRect(xx, y, 16, 1.5);

// ---------- 85 more Taipei City landmarks & scenery (compact drawing helpers) ----------
function G(x, top, w, gy, n, flip){
  const s = S(), H = gy - top;
  const dk = c => lerpC(c, '#141a2e', 0.62);
  const g = { x, top, w, gy, H, s, n, flip,
    c: col => lerpC(col, dk(col), n),
    X: u => x + u*w, F: v => gy - v*H, B: px => gy - Math.min(px*s, H), T: px => top + Math.min(px*s, H),
    m: (px, f) => Math.min(px*s, H*f),
  };
  g.R = (u0,u1,y0,y1,col) => { cx.fillStyle = g.c(col); cx.fillRect(g.X(Math.min(u0,u1)), Math.min(y0,y1), Math.abs(u1-u0)*w, Math.abs(y1-y0)); };
  g.P = (pts,col) => { cx.fillStyle = g.c(col); cx.beginPath(); pts.forEach(([u,y],i)=> i? cx.lineTo(g.X(u),y) : cx.moveTo(g.X(u),y)); cx.fill(); };
  g.L = (pts,col,lw=2) => { cx.strokeStyle = g.c(col); cx.lineWidth = lw; cx.lineCap='round'; cx.beginPath(); pts.forEach(([u,y],i)=> i? cx.lineTo(g.X(u),y) : cx.moveTo(g.X(u),y)); cx.stroke(); };
  g.C = (u,y,r,col) => { cx.fillStyle = g.c(col); cx.beginPath(); cx.arc(g.X(u), y, r, 0, 7); cx.fill(); };
  g.E = (u,y,ru,ry,col,half) => { cx.fillStyle = g.c(col); cx.beginPath(); cx.ellipse(g.X(u), y, ru*w, ry, 0, half?Math.PI:0, half?0:7); cx.fill(); };
  g.roof = (u0,u1,y,h,col,curl=1) => { const a=g.X(u0), b=g.X(u1), k=(b-a)*0.14;   // Chinese eave with upturned ends
    cx.fillStyle = g.c(col); cx.beginPath(); cx.moveTo(a-6*curl, y-h*0.25*curl); cx.quadraticCurveTo(a+k*0.6, y, a+k, y-h);
    cx.lineTo(b-k, y-h); cx.quadraticCurveTo(b-k*0.6, y, b+6*curl, y-h*0.25*curl); cx.lineTo(b-k*0.4, y); cx.lineTo(a+k*0.4, y); cx.fill(); };
  g.win = (u0,u1,y0,y1,col,dx=12,dy=14) => { for (let yy=Math.min(y0,y1)+4; yy<Math.max(y0,y1)-dy*0.5; yy+=dy) for (let xx=g.X(u0)+3; xx<g.X(u1)-dx*0.5; xx+=dx){
    cx.fillStyle = n>0.4 && rnd(xx*1.7+yy*0.3)>0.45 ? 'rgba(255,224,130,'+n+')' : g.c(col); cx.fillRect(xx, yy, dx*0.5, dy*0.5); } };
  g.bands = (u0,u1,y0,y1,col,step=24) => { for (let yy=Math.min(y0,y1)+step*0.5; yy<Math.max(y0,y1); yy+=step) g.R(u0,u1,yy,yy+3,col); };
  g.cols = (u0,u1,y0,y1,k,col,cw=0.04) => { for (let i=0;i<k;i++){ const u=u0+(u1-u0)*(k===1?0.5:i/(k-1)); g.R(u-cw/2,u+cw/2,y0,y1,col); } };
  g.arch = (u,y,wu,h,col) => { cx.fillStyle = g.c(col); cx.beginPath(); const a=g.X(u-wu/2), b=g.X(u+wu/2);
    cx.moveTo(a,y); cx.lineTo(a,y-h+(b-a)/2); cx.arc((a+b)/2, y-h+(b-a)/2, (b-a)/2, Math.PI, 0); cx.lineTo(b,y); cx.fill(); };
  g.tree = (u,y,r,col='#3f9a4a',trunk='#6b4423') => { g.R(u-0.02,u+0.02,y,y-r*1.2,trunk); g.C(u,y-r*1.4,r,col); g.C(u-0.06,y-r*1.1,r*0.75,col); g.C(u+0.06,y-r*1.1,r*0.75,col); };
  g.lant = (u,y) => { g.E(u,y,0.035,6*s,'#e53935'); if (n>0.3){ cx.fillStyle='rgba(255,120,80,'+n*0.35+')'; cx.beginPath(); cx.arc(g.X(u),y,10*s,0,7); cx.fill(); } };
  g.ground = (col) => g.R(0,1,gy-g.m(10,0.08),gy,col);
  return g;
}
const MK = (name, wm, maxH, ti, fn, hw=0.84) => ({ name, wm, maxH,
  draw:(x,top,w,gy,n,flip)=>fn(G(x,top,w,gy,n,flip)),
  hit:(x,top,w,gy)=>[[x+w*(1-hw)/2, top + Math.min(ti*S(), (gy-top)*0.4), w*hw]] });

const GRAV = () => 700*S(), FALL = () => 1500*S(), FLAP = () => -190*S(), SPEED = () => 160*S();   // floatier, gentler
// the whole game runs faster on a log curve as the score grows: forward speed, jumps and falls all scale together
const speedK = () => 1 + 0.2*Math.log(1 + score/6);

const HOLD_MAX = 0.3, LIFT = () => 1500*S(), VMAX_UP = () => -270*S();

const headX = () => W*0.36, headR = () => 20*S();
function reset(){
  state = 'ready'; y = neckBase().y - 30*S(); vy = 0; score = 0; camX = 0; obs = []; spawned = 0; lastCentre = neckBase().y - 40*S(); nextOb = headX() + 420*S();   // first obstacle a fixed distance ahead of the head, whatever the screen width recent.length = 0;
  trail = [{ ...neckBase(), d: 0 }];

  document.getElementById('panel').classList.remove('on'); document.getElementById('ready').classList.remove('off');
}
reset();
function tap(e){
  e && e.preventDefault && e.preventDefault();

  if (state === 'ready'){ state = 'play'; document.getElementById('ready').classList.add('off'); try{ window.onGameStart && window.onGameStart(); }catch(_){} }

}
cv.addEventListener('pointerdown', tap);
const letGo = () => { holding = false; };
addEventListener('pointerup', letGo); addEventListener('pointercancel', letGo); addEventListener('blur', letGo);
addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; if (document.getElementById('board').classList.contains('on')) return; if ((e.code==='Space'||e.code==='ArrowUp') && !e.repeat) tap(e); });
addEventListener('keyup', e => { if (e.code==='Space'||e.code==='ArrowUp') letGo(); });

function pickKind(h){   // a landmark that suits this height and hasn't shown up lately
  const ok = LANDMARKS.map((l,i)=>i).filter(i => LANDMARKS[i].maxH*S() >= h && !recent.includes(i));
  const pool = ok.length ? ok : LANDMARKS.map((l,i)=>i).filter(i => LANDMARKS[i].maxH*S() >= h);
  const k = pool[Math.floor(Math.random()*pool.length)];
  recent.push(k); if (recent.length > 40) recent.shift();
  return k;
}
function addObstacle(atX){
  const minTop = 60*S(), minBottom = 60*S();
  const gap = curGap(); spawned++;
  // keep the next gap within reach of the last one: at most 100 higher or 150 lower (centre to centre)
  const lo = minTop, hi = groundY() - minBottom - gap;
  let centre = lo + gap/2 + Math.random()*(hi - lo);
  if (lastCentre !== null) centre = Math.max(lastCentre - 100*S(), Math.min(lastCentre + 150*S(), centre));
  const gapTop = Math.max(lo, Math.min(hi, centre - gap/2)); lastCentre = gapTop + gap/2;
  const bottomH = groundY() - gapTop - gap, topH = gapTop + 10;
  const kb = pickKind(bottomH), kt = pickKind(topH);
  obs.push({ cx: atX, gapTop, gap, kb, kt, passed:false });
}
const obW = k => OB_W()*LANDMARKS[k].wm;
function boxesOf(o){
  const out = [], gy = groundY();
  { const w = obW(o.kb), x = o.cx - w/2, top = o.gapTop + o.gap;
    for (const [bx,by,bw] of LANDMARKS[o.kb].hit(x, top, w, gy)) out.push([bx, by, bw, gy-by]); }
  { const w = obW(o.kt), x = o.cx - w/2, base = o.gapTop + 10;   // mirrored: local top 0 ↔ screen gapTop, local base ↔ screen -10
    for (const [bx,by,bw] of LANDMARKS[o.kt].hit(x, 0, w, base)) out.push([bx, -100, bw, (o.gapTop - by) + 100]); }

}
function die(){
  if (state !== 'play') return;
  state = 'dead'; deadT = t; shake = 1; vy = Math.min(vy, -250*S());
  try{ navigator.vibrate && navigator.vibrate(60); }catch(_){}
  if (score > best){ best = score; try{ localStorage.setItem('sheepTaipeiBest', best); }catch(_){} }
  setTimeout(()=>{
    document.getElementById('ps').textContent = score; document.getElementById('pb').textContent = best;
    document.getElementById('pn').textContent = '脖子伸了 ' + neckMeters().toFixed(1) + ' m' + (score>0 && score===best ? '・🎉 新紀錄' : '');
    document.getElementById('panel').classList.add('on'); if (window.onGameOver) window.onGameOver(score);
  }, 500);
}
const neckMeters = () => Math.max(0, camX + headX() - neckBase().x)/PX_PER_M;

function update(dt){
  if (state !== 'dead') while (nextOb < camX + W + 160){ addObstacle(nextOb); nextOb += SPACING(); }
  if (state === 'ready'){ y = neckBase().y - 40*S() + Math.sin(t*3)*10; }
  if (state === 'play'){
    const gdt = dt*speedK(); gt += gdt;
    camX += SPEED()*gdt; vy += (vy < 0 ? GRAV() : FALL())*gdt;   // rise gently, fall faster
    if (holding && gt - holdStart < HOLD_MAX) vy = Math.max(VMAX_UP(), vy - LIFT()*gdt);
    y += vy*gdt;
    const hx = camX + headX(), r = headR();
    for (const o of obs){
      const half = Math.max(obW(o.kb), obW(o.kt))/2;
      if (!o.passed && o.cx + half < hx - r){ o.passed = true; score++; document.getElementById('score').textContent = score; }
      if (Math.abs(o.cx - hx) < half + r && touchesShape(o)) die();
    }
    if (y + r > groundY()){ y = groundY() - r; die(); }
    if (y - r < -40){ y = r - 40; vy = 0; }
    document.getElementById('neck').textContent = '脖子 ' + neckMeters().toFixed(1) + ' m';
  }
  if (state === 'dead'){ vy += GRAV()*dt; y = Math.min(groundY() - headR(), y + vy*dt); }
  obs = obs.filter(o => o.cx > camX - 300);
  if (state === 'play'){ const hp = { x: camX + headX(), y }, lp = trail[trail.length-1];
    const step = Math.hypot(hp.x-lp.x, hp.y-lp.y); if (step > 6){ hp.d = (lp.d || 0) + step; trail.push(hp); } }
  shake *= Math.pow(0.01, dt);
}
// ---- collision that follows the actual drawn shapes ----
// The obstacle is redrawn into a small off-screen canvas around the head, and only solid
// pixels (not glows, steam or night lights) inside a forgiving circle count as a hit.
const HS = 64, hitCv = document.createElement('canvas'); hitCv.width = hitCv.height = HS;
const hctx = hitCv.getContext('2d', { willReadFrequently: true });
function touchesShape(o){
  const hxS = headX(), r = headR()*0.72;
  hctx.setTransform(1,0,0,1,0,0); hctx.clearRect(0,0,HS,HS);
  hctx.translate(-(hxS - HS/2), -(y - HS/2));
  const real = cx; cx = hctx;
  try { drawObstacles(0, [o], false); } finally { cx = real; }
  const d = hctx.getImageData(0,0,HS,HS).data; let solid = 0;
  for (let py=0; py<HS; py++) for (let px=0; px<HS; px++){
    const dx = px - HS/2 + 0.5, dy = py - HS/2 + 0.5;
    if (dx*dx + dy*dy > r*r) continue;
    if (d[(py*HS+px)*4+3] > 200 && ++solid > 6) return true;
  }

}
function drawObstacles(n, list = obs, labels = true){
  const gy = groundY();
  for (const o of list){
    const sx = o.cx - camX; if (sx < -200 || sx > W + 200) continue;
    { const w = obW(o.kb), x = sx - w/2; LANDMARKS[o.kb].draw(x, o.gapTop + o.gap, w, gy, n, false);
      if (labels){ cx.font='900 '+Math.round(16*S())+'px "PingFang TC","Noto Sans TC",sans-serif'; cx.textAlign='center'; cx.fillStyle='#fff';
      cx.shadowColor='rgba(0,0,0,.6)'; cx.shadowBlur=5; cx.fillText(LANDMARKS[o.kb].name, sx, gy + 26*S()); cx.shadowBlur=0; } }
    { const w = obW(o.kt), x = sx - w/2;
      cx.save(); cx.translate(0, o.gapTop); cx.scale(1, -1);            // the hanging, upside-down landmark
      LANDMARKS[o.kt].draw(x, 0, w, o.gapTop + 10, n, true); cx.restore();
      if (labels){ cx.font='900 '+Math.round(16*S())+'px "PingFang TC","Noto Sans TC",sans-serif'; cx.textAlign='center'; cx.fillStyle='#fff';
      cx.shadowColor='rgba(0,0,0,.7)'; cx.shadowBlur=5; if (o.gapTop > 90*S() && sx > 150*S()) cx.fillText('↓ '+LANDMARKS[o.kt].name, sx, 68*S()); cx.shadowBlur=0; } }

function drawNeckAndHead(){
  const s = S(), hx = headX(), hy = y, thick = 14*s;
  // visible neck points, each with its arc length `d` from the body (stable, so the fur doesn't flicker)
  const pts = []; let firstOn = 0;
  for (let i=0;i<trail.length;i++) if (trail[i].x - camX < -60) firstOn = i;
  for (let i=firstOn;i<trail.length;i++) pts.push({ x: trail[i].x - camX, y: trail[i].y, d: trail[i].d || 0 });
  { const l = pts[pts.length-1]; pts.push({ x: hx, y: hy, d: l.d + Math.hypot(hx-l.x, hy-l.y) }); }
  if (state === 'ready'){ const b = neckBase(); pts.length = 0; let d = 0, px = 0, py = 0;
    for (let i=0;i<=16;i++){ const u=i/16, x = b.x-camX + (hx-(b.x-camX))*u, yy = b.y + (hy-b.y)*u - Math.sin(u*Math.PI)*30*s;

  path(); cx.strokeStyle='#fffdf7'; cx.lineWidth=thick*2; cx.stroke();
  // 4) a gentle belly shade and fine hairs on the edge
  walk((x,y0,nx,ny,k,tx,ty) => { if (k%2) return; const side = ny > 0 ? 1 : -1, j = rnd(k*3.1);
      cx.strokeStyle = 'rgba(190,180,160,.45)'; cx.lineWidth = 1.1*s; cx.beginPath();
      const bx = x+nx*side*(thick-2*s), by = y0+ny*side*(thick-2*s);
      cx.moveTo(bx, by); cx.lineTo(bx+nx*side*(4+j*4)*s+tx*(j-0.5)*4*s, by+ny*side*(4+j*4)*s+ty*(j-0.5)*4*s); cx.stroke();
      const j2 = rnd(k*5.7), side2 = -side; cx.strokeStyle = 'rgba(210,202,186,.35)'; cx.beginPath();
      const cx2 = x+nx*side2*(thick-1*s), cy2 = y0+ny*side2*(thick-1*s);
      cx.moveTo(cx2, cy2); cx.lineTo(cx2+nx*side2*(3+j2*3)*s, cy2+ny*side2*(3+j2*3)*s); cx.stroke(); });
  // sheep head
  const ang = state==='dead' ? Math.min(1.4, 0.4 + (t-deadT)*3) : Math.max(-0.5, Math.min(0.9, vy/900));
  cx.save(); cx.translate(hx, hy); cx.rotate(ang); cx.scale(s*0.75, s*0.75);
  puff(-6,-30,22); puff(10,-34,18);
  cx.fillStyle='#2b2b2b'; cx.beginPath(); cx.ellipse(18,0,40,27,0,0,7); cx.fill();
  const flap = t - flapT < 0.15 || (holding && gt - holdStart < HOLD_MAX);
  cx.save(); cx.translate(-4,-14); cx.rotate(flap ? -1.6 : -0.5 + Math.sin(t*6)*0.15);
  cx.fillStyle='#2b2b2b'; cx.beginPath(); cx.ellipse(-22,0,24,10,0,0,7); cx.fill();
  cx.fillStyle='#ff8fa3'; cx.beginPath(); cx.ellipse(-22,0,14,4,0,0,7); cx.fill(); cx.restore();
  if (state==='dead'){ cx.strokeStyle='#fff'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(24,-14); cx.lineTo(36,-2); cx.moveTo(36,-14); cx.lineTo(24,-2); cx.stroke(); }
  else { cx.fillStyle='#fff'; cx.beginPath(); cx.ellipse(30,-8,10,10,0,0,7); cx.fill(); cx.fillStyle='#000'; cx.beginPath(); cx.arc(34,-8+vy/300,5,0,7); cx.fill(); }
  cx.strokeStyle='#ff8fa3'; cx.lineWidth=3; cx.beginPath();
  if (flap || state==='dead') cx.ellipse(50,12,6,8,0,0,7); else cx.arc(48,8,7,0.2,Math.PI-0.2); cx.stroke();
  cx.fillStyle='rgba(255,120,150,.45)'; cx.beginPath(); cx.ellipse(36,10,7,4,0,0,7); cx.fill();
  cx.restore();
  if (state==='dead'){ cx.font='800 18px "PingFang TC","Noto Sans TC",sans-serif'; const tx='晚安！';
    const tw=cx.measureText(tx).width; cx.fillStyle='#fff'; cx.beginPath(); cx.roundRect(hx-tw/2-12, hy-74*s, tw+24, 34, 16); cx.fill();
    cx.fillStyle='#2b1030'; cx.textAlign='center'; cx.fillText(tx, hx, hy-51*s); }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now; t += dt;
  update(dt);
  const n = nightness();
  cx.save(); if (shake>0.01) cx.translate((Math.random()-0.5)*12*shake, (Math.random()-0.5)*12*shake);
  drawBackdrop();
  drawBody(); document.getElementById('score').style.opacity = state==='ready' ? 0 : 1;
  drawObstacles(n);
  drawNeckAndHead();
  cx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
// ===== 統計設定：把 Google Apps Script 網頁應用程式的網址貼在這裡（README 有步驟）=====
window.SHEET_API = "https://script.google.com/macros/s/AKfycbxfcDZV2VQlhBoSj4j61AvtgNe2uleTgX7Mnk6TRh0rgDG4h1rbFU96xSzRXqBuUlxycw/exec";
// ===== leaderboard UI =====
(function(){
  const $ = id => document.getElementById(id);
  let lastScore = 0;
  ['panel','board','boardBtn'].forEach(id => $(id).addEventListener('pointerdown', e => e.stopPropagation()));
  $('againBtn').onclick = () => { if (state === 'dead') reset(); };
  try{ $('nameIn').value = localStorage.getItem('sheepName') || ''; }catch(_){}
  window.onGameOver = sc => {
    lastScore = sc; $('lbMsg').textContent = '';
    $('lbForm').classList.toggle('on', !!window.LB && sc > 0);
    $('boardBtn2').style.display = window.LB ? '' : 'none';
  };
  $('sendBtn').onclick = async () => {
    const name = $('nameIn').value.trim().slice(0,12);
    if (!name){ $('lbMsg').textContent = '先輸入名字喔'; return; }
    try{ localStorage.setItem('sheepName', name); }catch(_){}
    $('sendBtn').disabled = true; $('lbMsg').textContent = '上傳中…';
    try{
      const r = await window.LB.submit(name, lastScore);
      $('lbMsg').textContent = r.saved ? '🎉 已上榜！目前第 ' + r.rank + ' 名' : '你之前的紀錄 ' + r.best + ' 分比較高，排行榜保留最高分（第 ' + r.rank + ' 名）';
      $('lbForm').classList.remove('on');
    }catch(e){ $('lbMsg').textContent = '上傳失敗，請稍後再試'; }
    $('sendBtn').disabled = false;
  };
  const openBoard = async () => {
    $('board').classList.add('on'); $('boardList').innerHTML = ''; $('boardNote').textContent = '讀取中…';
    try{
      const rows = await window.LB.top(20), me = window.LB.pid;
      rows.forEach((r,i) => { const li = document.createElement('li'); if (r.id === me) li.className = 'me';
        const rk = document.createElement('span'); rk.className='rk'; rk.textContent = ['🥇','🥈','🥉'][i] || (i+1);
        const nm = document.createElement('span'); nm.className='nm'; nm.textContent = r.name;
        const sc = document.createElement('span'); sc.className='sc'; sc.textContent = r.score;
        li.append(rk, nm, sc); $('boardList').appendChild(li); });
      $('boardNote').textContent = rows.length ? '每台裝置保留最高分・前 20 名' : '還沒有人上榜，快來搶第一！';
    }catch(e){ $('boardNote').textContent = '讀取失敗，請稍後再試'; }
  };
  $('boardBtn').onclick = openBoard; $('boardBtn2').onclick = openBoard;
  $('boardClose').onclick = () => $('board').classList.remove('on');
  window.enableBoard = () => { $('boardBtn').style.display = ''; };
})();
window.showStats = (plays, players) => {
  const txt = '🎮 已被玩 ' + plays.toLocaleString() + ' 次　👥 ' + players.toLocaleString() + ' 人玩過';
  document.getElementById('statsReady').textContent = txt;
  document.getElementById('statsPanel').textContent = txt;
};
</script>
<script>
// Stats + global leaderboard, stored in a Google Sheet in the owner's Drive via Apps Script.
// If SHEET_API is empty the game simply runs without them.
(function(){
  const API = window.SHEET_API; if (!API) return;
  const call = (params, write) => write
    ? fetch(API, { method:'POST', body: JSON.stringify(params), headers:{ 'Content-Type':'text/plain;charset=utf-8' } }).then(r => r.json())
    : fetch(API + '?' + new URLSearchParams(params)).then(r => r.json());
  const show = v => { if (v && typeof v.plays === 'number') window.showStats(v.plays, v.players); };
  let pid = null; try{ pid = localStorage.getItem('sheepPid'); }catch(_){}
  if (!pid){                                   // first visit on this device/browser = a new player
    pid = (crypto.randomUUID ? crypto.randomUUID() : 'p' + String(Math.random()).slice(2));
    try{ localStorage.setItem('sheepPid', pid); }catch(_){}
    call({ action:'player' }, true).then(show).catch(()=>{});
  } else call({ action:'stats' }).then(show).catch(()=>{});
  window.onGameStart = () => call({ action:'start' }, true).then(show).catch(()=>{});
  window.LB = {
    pid,
    async submit(name, score){ const r = await call({ action:'submit', pid, name, score }, true); if (r.error) throw new Error(r.error); return r; },
    async top(n){ const r = await call({ action:'top', pid, n }); return (r.rows || []).map(x => ({ id: x.me ? pid : '', name: String(x.name || '？'), score: +x.score || 0 })); },
  };
  window.enableBoard();
})();
</script>
